[project]
name = "gtm-mcp"
version = "0.2.0"
description = "Deterministic, preview-only GTM tooling exposed over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kate Kruger" }]
keywords = ["gtm", "mcp", "clay", "n8n", "outreach"]
dependencies = [
    "fastmcp>=4.0.3,<5",
    "httpx>=0.28.1,<1",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.6,<1"]

[project.urls]
Homepage = "https://github.com/katekruger/gtm-superconnector"
Issues = "https://github.com/katekruger/gtm-superconnector/issues"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "servers" }

[tool.setuptools.packages.find]
where = ["servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["servers"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
# Defect-finding rules only. Deliberately excludes `I` (import sorting) and `UP`
# (pyupgrade): contact_tiers is a self-contained library with a settled style,
# and churning it for cosmetics would obscure real history for no benefit.
select = ["E", "F", "B"]
ignore = [
    "E501",  # line length — core.py favors dense single-expression returns
    "E741",  # ambiguous names (l, I, O) — pre-existing convention in the resolver
]
