name: Release

# Tag-triggered: verify the tag matches the plugin version and CHANGELOG.md
# has a section for it -> run the full CI suite -> build the sealed
# .plugin archive -> create the GitHub Release with that archive attached.
#
# This plugin is not published to PyPI or the MCP Registry — see AGENTS.md,
# "What this repo deliberately does not do". Distribution is the self-
# marketplace (.claude-plugin/marketplace.json, "source": "./") for a clone
# install, and this Release's attached dist/gtm-superconnector.plugin for a
# built-archive install.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: verify tag matches version, CHANGELOG has a section
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Verify tag matches plugin version
        # .claude-plugin/plugin.json is one of the four files ./scripts/bump-version.sh
        # keeps in sync; the `ci` job below re-verifies all four agree.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match" \
                 "plugin version $pkg_version (.claude-plugin/plugin.json)"
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches plugin version $pkg_version"

      - name: Verify CHANGELOG.md has a section for this version
        run: |
          pkg_version="$(jq -r .version .claude-plugin/plugin.json)"
          if ! grep -qE "^## \[?${pkg_version//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $pkg_version' section"
            exit 1
          fi
          echo "OK: CHANGELOG.md has a section for $pkg_version"

  ci:
    name: run CI
    needs: verify
    uses: $/.github/workflows/ci.yml

  build:
    name: build the plugin archive
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        run: ./scripts/build-plugin.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-archive
          path: dist/gtm-superconnector.plugin

  github-release:
    name: create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-archive
          path: dist/

      - name: Extract this version's CHANGELOG section
        run: |
          pkg_version="$(jq -r .version .claude-plugin/plugin.json)"
          awk -v ver="$pkg_version" '
            $0 ~ "^## \\[?" ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/gtm-superconnector.plugin
