name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, test, and verify the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the secrets scan can see every commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check servers tests

      - name: Verify the MCP server imports cleanly
        run: PYTHONPATH=servers python -c "import gtm_mcp.server"

      - name: Validate every JSON file parses
        # rglob, not glob("**/*.json") — the latter skips dotfile directories,
        # which is where both plugin manifests live.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          files = [p for p in Path('.').rglob('*.json')
                   if '.git' not in p.parts and 'node_modules' not in p.parts]
          assert len(files) >= 5, f"expected at least 5 JSON files, found {len(files)}"
          for f in files:
              try:
                  json.loads(f.read_text())
              except json.JSONDecodeError as exc:
                  sys.exit(f"{f}: {exc}")
          print(f"{len(files)} JSON files parse")
          for f in sorted(files):
              print(f"  {f}")
          PY

      - name: Validate the plugin manifests against the Claude Code spec
        run: |
          npm install -g @anthropic-ai/claude-code
          ./scripts/validate-plugin.sh

      - name: No company-specific branding in the tree
        # The CRM endpoint is user-supplied. A vendor name reappearing here means
        # a hardcoded endpoint has come back with it.
        run: |
          # The bracket keeps the literal string out of this file, so the gate
          # does not match its own source and fail every build.
          if grep -rniE "m[e]rget" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::Company-specific branding found. The CRM endpoint must stay user-supplied via userConfig."
            exit 1
          fi
          echo "No company-specific branding found."

      - name: Verify skill frontmatter
        run: python scripts/check-skills.py

      - name: Verify versions agree across every file
        run: ./scripts/bump-version.sh --check

      - name: Verify shell scripts parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Test
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
