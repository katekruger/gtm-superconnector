name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, test, and verify the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the secrets scan can see every commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check servers tests

      - name: Verify the MCP server imports cleanly
        run: PYTHONPATH=servers python -c "import gtm_mcp.server"

      - name: Validate JSON manifests
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          python -c "import json; json.load(open('.mcp.json'))"
          python -c "import json; json.load(open('.version-bump.json'))"
          python -c "import json; json.load(open('config/clay-functions.example.json'))"

      - name: Validate the plugin manifests against the Claude Code spec
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Verify skill frontmatter
        run: python scripts/check-skills.py

      - name: Verify versions agree across every file
        run: ./scripts/bump-version.sh --check

      - name: Verify shell scripts parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Test
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
